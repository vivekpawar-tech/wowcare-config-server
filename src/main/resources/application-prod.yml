# ==============================================================================
# PROD Profile - For production environment
# ==============================================================================

server:
  port: ${SERVER_PORT:8888}

spring:
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:git@github.com:Atoconn-System-Labs-Private-Limited/wowcare-configuration-service.git}
          default-label: main
          clone-on-start: true
          timeout: 30
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

# NOTE: prod previously enabled asymmetric JKS keystore encryption pointing at
# /config/keystore/config-server-prod.jks (an AWS-Secrets-Manager-era assumption).
# That keystore does not exist on the Hetzner cluster and `fail-on-error: true`
# aborted startup ("Invalid keystore location"). Aligned with application-uat.yml,
# which uses no keystore (the config repo holds no {cipher} values). Re-introduce
# only alongside a mounted keystore secret if config-value encryption is required.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${HOSTNAME}
    prefer-ip-address: true
    non-secure-port: ${SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ERROR
    org.springframework.cloud.config: WARN
    com.atoconn: INFO
